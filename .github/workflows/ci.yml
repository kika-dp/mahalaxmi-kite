name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kite
          POSTGRES_PASSWORD: kite
          POSTGRES_DB: kite_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kite -d kite_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://kite:kite@localhost:5432/kite_test
      DATABASE_URL_TEST: postgres://kite:kite@localhost:5432/kite_test
      JWT_ACCESS_SECRET: ci-only-secret-that-is-long-enough-to-pass-validation-123
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm build:packages
      - name: Typecheck everything
        run: pnpm -r --if-present typecheck
      - name: Unit tests (shared, api, mobile)
        run: |
          pnpm --filter @kite/shared test
          pnpm --filter api test
          pnpm --filter mobile test
      - name: API integration tests (real PostgreSQL)
        run: pnpm --filter api test:e2e
      - name: Production builds
        run: |
          pnpm --filter api build
          pnpm --filter crm build
      - name: Mobile JS bundle (iOS)
        run: cd apps/mobile && CI=1 npx expo export --platform ios --output-dir dist
